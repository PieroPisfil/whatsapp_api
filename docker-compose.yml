services:
  whatsapp-api-1:
    build: .
    container_name: whatsapp-api-1
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=1
      - JWT_SECRET=${JWT_SECRET}
      - SECRET_WORD=${SECRET_WORD}
      - PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH}
      - WEBHOOK_URLS=${WEBHOOK_URLS}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - BODY_LIMIT=${BODY_LIMIT:-10mb}
      - MAX_MEDIA_BYTES=${MAX_MEDIA_BYTES:-8388608}
    shm_size: '1.5gb'
    ports:
      # Solo localhost: el nginx del host hace el reverse proxy
      - "127.0.0.1:3001:3001"
    volumes:
      - ./.wwebjs_auth_1:/app/.wwebjs_auth

