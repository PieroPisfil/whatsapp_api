  redis:
    image: redis:7-alpine
    container_name: whatsapp-redis
    restart: unless-stopped
    # Sin puertos publicados: solo accesible desde la red Docker de este compose
    volumes:
      - whatsapp_redis_data:/data

volumes:
  whatsapp_redis_data:
