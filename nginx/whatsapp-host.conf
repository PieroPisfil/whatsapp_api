# Ejemplo para el nginx del HOST (no Docker).
# Copia este archivo o su contenido a tu nginx del VPS, por ejemplo:
#   sudo cp nginx/whatsapp-host.conf /etc/nginx/sites-available/whatsapp
#   sudo ln -s /etc/nginx/sites-available/whatsapp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ajusta server_name y las rutas SSL según tu dominio/certbot del host.

upstream whatsapp_api_1 {
    server 127.0.0.1:3001;
}

# upstream whatsapp_api_2 {
#     server 127.0.0.1:3002;
# }
#
# upstream whatsapp_api_3 {
#     server 127.0.0.1:3003;
# }

server {
    listen 80;
    server_name wa.tu-dominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wa.tu-dominio.com;

    ssl_certificate     /etc/letsencrypt/live/wa.tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.tu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    location /api1/ {
        proxy_pass http://whatsapp_api_1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # location /api2/ {
